<title>Daily Fuel Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a phone-shaped app column (max 520px, centred on desktop) — week strip, calorie ring, meal list — with a camera button docked at the bottom and bottom sheets for review, manual entry and goals. */
:root {
  --bg: #EEF2EE;
  --surface: #FFFFFF;
  --raised: #F6F8F6;
  --ink: #16211B;
  --muted: #66736B;
  --line: #E1E7E2;
  --accent: #C0285F;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE7EF;
  --protein: #1C8077;
  --carbs: #D08A12;
  --fat: #7556C4;
  --over: #D9480F;
  --track: #E4EAE5;
  --shadow: 0 1px 2px rgba(22,33,27,.05), 0 8px 24px rgba(22,33,27,.06);
  --scrim: rgba(12,18,15,.45);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1411; --surface: #18201C; --raised: #1F2924; --ink: #EAF0EC; --muted: #98A69E; --line: #26302B;
  --accent: #F0709E; --accent-ink: #1A0B11; --accent-soft: #3B1B28; --protein: #4CC4B9; --carbs: #EDB65A; --fat: #A991F2;
  --over: #FF8E55; --track: #29342E; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); --scrim: rgba(0,0,0,.6); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E1411; --surface: #18201C; --raised: #1F2924; --ink: #EAF0EC; --muted: #98A69E; --line: #26302B;
  --accent: #F0709E; --accent-ink: #1A0B11; --accent-soft: #3B1B28; --protein: #4CC4B9; --carbs: #EDB65A; --fat: #A991F2;
  --over: #FF8E55; --track: #29342E; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); --scrim: rgba(0,0,0,.6); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(120px + env(safe-area-inset-bottom, 0px));
}
.app { max-width: 520px; margin: 0 auto; display: grid; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, .fab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 12px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top .when { font-size: 13px; color: var(--muted); font-weight: 500; }
h1 { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -0.025em; margin: 0; line-height: 1.05; }
.round { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink); }
.round svg { width: 20px; height: 20px; }

/* Week strip */
.week { display: grid; grid-template-columns: 28px repeat(7, minmax(0, 1fr)) 28px; align-items: center; gap: 2px; }
.week .arrow { height: 56px; color: var(--muted); font-size: 20px; border-radius: 10px; }
.week .arrow:disabled { opacity: .3; cursor: default; }
.day { display: grid; justify-items: center; gap: 4px; padding: 6px 0 8px; border-radius: 14px; }
.day .dow { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.day .mini { position: relative; width: 34px; height: 34px; }
.day .mini svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.day .mini span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.day[aria-current="date"] { background: var(--surface); box-shadow: var(--shadow); }
.day[aria-current="date"] .dow { color: var(--accent); }
.day:disabled { opacity: .35; cursor: default; }

/* Hero */
.hero { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 24px 20px 20px; display: grid; gap: 20px; }
.ringwrap { position: relative; width: min(220px, 62vw); aspect-ratio: 1; max-width: 100%; margin: 0 auto; }
.ringwrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ringfg { transition: stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1), stroke .3s; }
.ringwrap .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.big { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 12vw, 52px); line-height: 1; letter-spacing: -0.03em; }
.big-sub { font-size: 13px; color: var(--muted); margin-top: 6px; font-weight: 500; }
.split { display: flex; justify-content: center; gap: 28px; font-size: 13px; color: var(--muted); }
.split b { display: block; color: var(--ink); font-size: 17px; font-weight: 600; }
.split > div { text-align: center; }
.macros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding-top: 16px; border-top: 1px solid var(--line); }
.macro { display: grid; gap: 6px; min-width: 0; }
.macro .lbl { font-size: 12px; color: var(--muted); font-weight: 500; }
.macro .val { font-size: 14px; font-weight: 600; white-space: nowrap; }
.macro .val small { color: var(--muted); font-weight: 400; font-size: 12px; }
.mbar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.mbar i { display: block; height: 100%; border-radius: 3px; transition: width .5s ease; }

.status { font-size: 12.5px; color: var(--muted); text-align: center; }

/* Meals */
.meals { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 6px 0; }
.meal + .meal { border-top: 1px solid var(--line); }
.mealhead { display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px 20px; }
.mealhead h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 17px; flex: 1; letter-spacing: -0.01em; }
.mealhead .kc { font-size: 14px; color: var(--muted); font-weight: 500; }
.addbtn { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 20px; line-height: 1; font-weight: 500; }
.entry { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 12px 8px 20px; }
.entry .name { min-width: 0; overflow-wrap: anywhere; font-weight: 500; font-size: 14.5px; }
.entry .meta { font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 1px; }
.entry .kcal { font-weight: 600; font-size: 14.5px; }
.del { width: 32px; height: 32px; border-radius: 50%; color: var(--muted); font-size: 18px; display: grid; place-items: center; }
.del:hover { background: var(--raised); color: var(--over); }
.nothing { padding: 0 20px 14px; font-size: 13.5px; color: var(--muted); }

/* Dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; pointer-events: none;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 55%, transparent); }
.fab { pointer-events: auto; display: inline-flex; align-items: center; gap: 10px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 15px 26px 15px 22px; font-family: var(--display); font-weight: 600; font-size: 17px; box-shadow: 0 6px 20px rgba(192,40,95,.35); }
.fab svg { width: 22px; height: 22px; }
.fab:active { transform: scale(.97); }
.photo-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* Sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; display: flex; justify-content: center; pointer-events: none; }
.sheet .panel { pointer-events: auto; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: 0 -8px 40px rgba(0,0,0,.18);
  padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  display: grid; gap: 16px; animation: up .25s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(40px); opacity: .6; } }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto; }
.sheethead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheethead h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
.close { width: 34px; height: 34px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; font-size: 18px; color: var(--muted); }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .lab { font-size: 12.5px; color: var(--muted); font-weight: 500; }
input, select { font: inherit; font-size: 16px; color: var(--ink); background: var(--raised); border: 1px solid transparent; border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0; }
input:focus, select:focus { border-color: var(--accent); outline: none; }
.grid2 { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid3 { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--raised); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { padding: 8px 0; border-radius: 9px; font-size: 13.5px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.primary { background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 14px 18px; font-weight: 600; font-size: 16px; width: 100%; }
.primary:disabled { opacity: .45; cursor: default; }
.secondary { background: var(--raised); border-radius: 14px; padding: 13px 18px; font-weight: 500; width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--raised); border-radius: 999px; padding: 8px 14px; font-size: 13.5px; }
.chip b { font-weight: 600; margin-left: 4px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.err { color: var(--over); font-size: 13.5px; margin: 0; }

/* Photo review */
.shot { width: 100%; max-height: 220px; object-fit: cover; border-radius: 16px; display: block; }
.thinking { display: flex; align-items: center; gap: 12px; font-weight: 500; }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--track); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.ritem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ritem:last-of-type { border-bottom: 0; }
.ritem input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); padding: 0; }
.ritem .name { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.ritem .meta { font-size: 12px; color: var(--muted); font-weight: 400; }
.ritem .right { display: grid; justify-items: end; gap: 4px; }
.ritem .right b { font-weight: 600; }
.ritem select { width: auto; padding: 4px 6px; font-size: 13px; border-radius: 8px; }
.totalrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.totalrow .t { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: -0.02em; }
.conf { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--raised); color: var(--muted); }
.conf.high { color: var(--protein); } .conf.low { color: var(--over); }
.inline { display: flex; gap: 8px; } .inline input { flex: 1; } .inline button { width: auto; padding: 0 16px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 500; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .ringfg, .mbar i, .sheet .panel { transition: none !important; animation: none !important; } .spinner { animation-duration: 2s; } }
</style>

<div class="app">
  <header class="top">
    <div>
      <div class="when" id="whenLabel">Wednesday, Nov 18</div>
      <h1 id="dayTitle">Today</h1>
    </div>
    <button class="round" id="goalsBtn" aria-label="Goals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
    </button>
  </header>

  <nav class="week" id="week" aria-label="Choose a day"></nav>

  <section class="hero" aria-label="Today's calories">
    <div class="ringwrap">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="88" fill="none" stroke="var(--track)" stroke-width="14"></circle>
        <circle id="ring" class="ringfg" cx="100" cy="100" r="88" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="552.92" stroke-dashoffset="552.92"></circle>
      </svg>
      <div class="center">
        <div class="big" id="remaining">2,000</div>
        <div class="big-sub" id="remainingLabel">kcal left</div>
      </div>
    </div>
    <div class="split">
      <div><b id="eaten">0</b>eaten</div>
      <div><b id="goalOut">2,000</b>goal</div>
    </div>
    <div class="macros">
      <div class="macro" id="mP"></div>
      <div class="macro" id="mC"></div>
      <div class="macro" id="mF"></div>
    </div>
  </section>

  <p class="status" id="status">Loading your log…</p>

  <section class="meals" id="meals" aria-label="Meals"></section>
</div>

<div class="dock">
  <button class="fab" id="snapBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5h3.2l1.8-2.8h7l1.8 2.8h3.2v10.8h-17z"/><circle cx="12" cy="13.6" r="3.6"/></svg>
    Snap meal
  </button>
  <input class="photo-input" id="photo" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden><div class="panel" id="sheetPanel" role="dialog" aria-modal="true"></div></div>
<datalist id="foodList"></datalist>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  // Common foods: kcal and macros (g) per stated serving. Approximate reference values.
  const FOODS = [
    ["Egg, large", "1 egg (50 g)", 72, 6.3, 0.4, 4.8],
    ["Egg whites", "3 large (100 g)", 52, 10.9, 0.7, 0.2],
    ["Oatmeal, cooked", "1 cup (234 g)", 166, 5.9, 28, 3.6],
    ["Greek yogurt, plain nonfat", "170 g", 100, 17, 6, 0.7],
    ["Banana", "1 medium (118 g)", 105, 1.3, 27, 0.4],
    ["Apple", "1 medium (182 g)", 95, 0.5, 25, 0.3],
    ["Blueberries", "1 cup (148 g)", 84, 1.1, 21, 0.5],
    ["Whole wheat bread", "1 slice (32 g)", 80, 4, 14, 1.1],
    ["White rice, cooked", "1 cup (158 g)", 205, 4.3, 45, 0.4],
    ["Brown rice, cooked", "1 cup (195 g)", 216, 5, 45, 1.8],
    ["Pasta, cooked", "1 cup (140 g)", 221, 8.1, 43, 1.3],
    ["Chicken breast, cooked", "100 g", 165, 31, 0, 3.6],
    ["Salmon, cooked", "100 g", 206, 22, 0, 12],
    ["Ground beef 90%, cooked", "100 g", 217, 26, 0, 12],
    ["Tofu, firm", "100 g", 144, 17, 2.8, 8.7],
    ["Black beans, cooked", "1/2 cup (86 g)", 114, 7.6, 20, 0.5],
    ["Lentils, cooked", "1/2 cup (99 g)", 115, 8.9, 20, 0.4],
    ["Broccoli, cooked", "1 cup (156 g)", 55, 3.7, 11, 0.6],
    ["Mixed salad greens", "2 cups (85 g)", 15, 1.2, 2.8, 0.2],
    ["Avocado", "1/2 fruit (100 g)", 160, 2, 8.5, 14.7],
    ["Potato, baked", "1 medium (173 g)", 161, 4.3, 37, 0.2],
    ["Sweet potato, baked", "1 medium (114 g)", 103, 2.3, 24, 0.2],
    ["Almonds", "1 oz (28 g)", 164, 6, 6.1, 14.2],
    ["Peanut butter", "2 tbsp (32 g)", 190, 7, 7, 16],
    ["Olive oil", "1 tbsp (14 g)", 119, 0, 0, 13.5],
    ["Butter", "1 tbsp (14 g)", 102, 0.1, 0, 11.5],
    ["Cheddar cheese", "1 oz (28 g)", 115, 6.5, 0.4, 9.5],
    ["Milk, 2%", "1 cup (244 g)", 122, 8.1, 12, 4.8],
    ["Oat milk", "1 cup (240 ml)", 120, 3, 16, 5],
    ["Whey protein shake", "1 scoop (30 g)", 120, 24, 3, 1.5],
    ["Coffee, black", "1 cup", 2, 0.3, 0, 0],
    ["Latte, whole milk", "16 oz", 220, 12, 18, 11],
    ["Orange juice", "1 cup (248 g)", 112, 1.7, 26, 0.5],
    ["Beer", "12 oz", 153, 1.6, 13, 0],
    ["Red wine", "5 oz", 125, 0.1, 3.8, 0],
    ["Pizza, cheese", "1 slice (107 g)", 285, 12, 36, 10],
    ["Burrito, bean & cheese", "1 (200 g)", 380, 15, 55, 11],
    ["Hamburger with bun", "1", 354, 20, 29, 17],
    ["French fries", "medium (117 g)", 365, 4, 48, 17],
    ["Dark chocolate 70%", "1 oz (28 g)", 170, 2.2, 13, 12],
    ["Granola bar", "1 bar (42 g)", 190, 4, 29, 7],
    ["Hummus", "2 tbsp (30 g)", 70, 2, 4, 5],
  ];
  const MEALS = [["breakfast", "Breakfast"], ["lunch", "Lunch"], ["dinner", "Dinner"], ["snack", "Snacks"]];
  const PORTIONS = [0.5, 0.75, 1, 1.25, 1.5, 2];
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Math.round(n).toLocaleString();
  const g1 = (n) => (Math.round(n * 10) / 10).toString();
  const pad = (n) => String(n).padStart(2, "0");
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const todayKey = () => keyOf(new Date());
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const mealByClock = () => { const h = new Date().getHours(); return h < 11 ? "breakfast" : h < 15 ? "lunch" : h < 21 ? "dinner" : "snack"; };

  const state = {
    date: todayKey(),
    weekEnd: todayKey(),
    days: new Map(),
    goals: { kcal: 2000, p: 120, c: 225, f: 67 },
  };

  $("foodList").innerHTML = FOODS.map(f => `<option value="${esc(f[0])}">${esc(f[1])} · ${f[2]} kcal</option>`).join("");

  // ---------- Storage: db when signed in, browser storage otherwise ----------
  let backend = null;
  const LS = "fuel-log-v1";
  const setStatus = (msg) => { const s = $("status"); s.textContent = msg || ""; s.hidden = !msg; };
  const localBackend = () => {
    try {
      const raw = JSON.parse(localStorage.getItem(LS) || "{}");
      Object.entries(raw.days || {}).forEach(([k, v]) => state.days.set(k, v));
      if (raw.goals) state.goals = raw.goals;
    } catch (e) {}
    const persist = () => { try { localStorage.setItem(LS, JSON.stringify({ days: Object.fromEntries(state.days), goals: state.goals })); } catch (e) {} };
    return { saveDay: async () => persist(), saveGoals: async () => persist() };
  };

  async function connect() {
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]); } catch (e) {}
    const id = user ? await user.id().catch(() => null) : null;
    if (!db || !id) {
      backend = localBackend();
      setStatus("Saved on this device only. Sign in to claude.ai to sync across devices.");
      render();
      return;
    }
    const base = `data/users/${id}`;
    const daysCol = db.collection(`${base}/days`);
    const goalsDoc = db.doc(`${base}/settings/goals`);
    const chains = new Map();
    const queue = (key, fn) => { const next = (chains.get(key) || Promise.resolve()).then(fn, fn); chains.set(key, next.catch(() => {})); return next; };
    backend = {
      saveDay: (date, entries) => queue("d" + date, () => entries.length ? daysCol.doc(date).set({ date, entries }) : daysCol.doc(date).delete()),
      saveGoals: (goals) => queue("goals", () => goalsDoc.set(goals)),
    };
    const timer = setTimeout(() => setStatus("Your log is slow to load. New entries will still save."), 10000);
    daysCol.orderBy("date", "desc").limit(400).onSnapshot((snap) => {
      clearTimeout(timer);
      if (!snap.metadata.fromCache) setStatus("");
      state.days = new Map(snap.docs.map(d => [d.id, d.data().entries || []]));
      render();
    }, (err) => { clearTimeout(timer); setStatus("Couldn't load your log. Reopen the page to try again."); });
    goalsDoc.onSnapshot((snap) => { if (snap.exists) { state.goals = { ...state.goals, ...snap.data() }; render(); } }, () => {});
  }

  // ---------- Rendering ----------
  const totals = (entries) => entries.reduce((t, e) => {
    const q = e.qty || 1; t.kcal += e.kcal * q; t.p += (e.p || 0) * q; t.c += (e.c || 0) * q; t.f += (e.f || 0) * q; return t;
  }, { kcal: 0, p: 0, c: 0, f: 0 });

  function titleFor(k) {
    const t = todayKey();
    if (k === t) return "Today";
    if (k === addDays(t, -1)) return "Yesterday";
    return fromKey(k).toLocaleDateString(undefined, { weekday: "long" });
  }

  function renderWeek() {
    const nav = $("week");
    const goal = state.goals.kcal || 2000;
    const today = todayKey();
    let html = `<button class="arrow" id="wkPrev" aria-label="Previous week">‹</button>`;
    for (let i = 6; i >= 0; i--) {
      const k = addDays(state.weekEnd, -i);
      const d = fromKey(k);
      const kc = totals(state.days.get(k) || []).kcal;
      const frac = Math.min(1, kc / goal), C = 2 * Math.PI * 15;
      const col = kc > goal ? "var(--over)" : "var(--accent)";
      html += `<button class="day" data-k="${k}" ${k === state.date ? 'aria-current="date"' : ""} ${k > today ? "disabled" : ""} aria-label="${d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })}, ${fmt(kc)} kcal">
        <span class="dow">${d.toLocaleDateString(undefined, { weekday: "narrow" })}</span>
        <span class="mini"><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--track)" stroke-width="3"/>${kc ? `<circle cx="18" cy="18" r="15" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"/>` : ""}</svg><span>${d.getDate()}</span></span>
      </button>`;
    }
    html += `<button class="arrow" id="wkNext" aria-label="Next week" ${state.weekEnd >= today ? "disabled" : ""}>›</button>`;
    nav.innerHTML = html;
    nav.querySelectorAll(".day").forEach(b => b.onclick = () => { state.date = b.dataset.k; render(); });
    $("wkPrev").onclick = () => { state.weekEnd = addDays(state.weekEnd, -7); state.date = state.weekEnd; render(); };
    $("wkNext").onclick = () => {
      const t = todayKey();
      state.weekEnd = addDays(state.weekEnd, 7) > t ? t : addDays(state.weekEnd, 7);
      state.date = state.weekEnd; render();
    };
  }

  const macroHTML = (name, color, val, goal) => `
    <span class="lbl">${name}</span>
    <div class="mbar"><i style="width:${goal ? Math.min(100, (val / goal) * 100) : 0}%;background:var(${color})"></i></div>
    <span class="val">${fmt(val)}<small> / ${fmt(goal)} g</small></span>`;

  function render() {
    const entries = state.days.get(state.date) || [];
    const t = totals(entries);
    const goal = state.goals.kcal || 2000;
    const left = goal - t.kcal, over = left < 0;
    const C = 2 * Math.PI * 88;
    const ring = $("ring");
    ring.style.strokeDashoffset = C * (1 - Math.min(1, t.kcal / goal));
    ring.style.stroke = over ? "var(--over)" : "var(--accent)";
    $("remaining").textContent = fmt(Math.abs(left));
    $("remaining").style.color = over ? "var(--over)" : "";
    $("remainingLabel").textContent = over ? "kcal over goal" : "kcal left";
    $("eaten").textContent = fmt(t.kcal);
    $("goalOut").textContent = fmt(goal);
    $("mP").innerHTML = macroHTML("Protein", "--protein", t.p, state.goals.p);
    $("mC").innerHTML = macroHTML("Carbs", "--carbs", t.c, state.goals.c);
    $("mF").innerHTML = macroHTML("Fat", "--fat", t.f, state.goals.f);
    $("dayTitle").textContent = titleFor(state.date);
    $("whenLabel").textContent = fromKey(state.date).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    renderWeek();

    const box = $("meals");
    box.innerHTML = "";
    for (const [mk, ml] of MEALS) {
      const items = entries.filter(e => e.meal === mk);
      const sec = document.createElement("div");
      sec.className = "meal";
      sec.innerHTML = `<div class="mealhead"><h2>${ml}</h2><span class="kc">${items.length ? fmt(totals(items).kcal) + " kcal" : ""}</span><button class="addbtn" type="button" aria-label="Add to ${ml}">+</button></div>`;
      sec.querySelector(".addbtn").onclick = () => openManual(mk);
      if (!items.length) {
        const p = document.createElement("div");
        p.className = "nothing";
        p.textContent = mk === mealByClock() && state.date === todayKey() ? "Nothing yet. Tap Snap meal to log it from a photo." : "Nothing logged";
        sec.appendChild(p);
      }
      for (const e of items) {
        const q = e.qty || 1;
        const row = document.createElement("div");
        row.className = "entry";
        const name = document.createElement("div");
        name.className = "name"; name.textContent = e.name;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${q !== 1 ? g1(q) + "× · " : ""}P ${fmt((e.p || 0) * q)}g · C ${fmt((e.c || 0) * q)}g · F ${fmt((e.f || 0) * q)}g`;
        name.appendChild(meta);
        const kc = document.createElement("div");
        kc.className = "kcal"; kc.textContent = fmt(e.kcal * q);
        const del = document.createElement("button");
        del.className = "del"; del.type = "button"; del.textContent = "×";
        del.setAttribute("aria-label", `Remove ${e.name}`);
        del.onclick = () => removeEntry(e.id);
        row.append(name, kc, del);
        sec.appendChild(row);
      }
      box.appendChild(sec);
    }
  }

  // ---------- Actions ----------
  const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1800); };
  async function writeDay(date, entries, okMsg) {
    state.days.set(date, entries);
    render();
    if (!backend) return;
    try { await backend.saveDay(date, entries); if (okMsg) toast(okMsg); }
    catch (e) { toast(e?.code === "quota_exceeded" ? "Storage is full. Delete old entries to keep logging." : "Couldn't save. Check your connection."); }
  }
  const addEntries = (list, msg) => writeDay(state.date, [...(state.days.get(state.date) || []), ...list.map(e => ({ id: uid(), t: Date.now(), ...e }))], msg);
  const removeEntry = (id) => writeDay(state.date, (state.days.get(state.date) || []).filter(e => e.id !== id), "Removed");

  // ---------- Sheets ----------
  let onSheetClose = null;
  function openSheet(html, after) {
    $("sheetPanel").innerHTML = `<div class="grab"></div>${html}`;
    $("sheet").hidden = false; $("scrim").hidden = false;
    document.body.style.overflow = "hidden";
    $("sheetPanel").querySelectorAll("[data-close]").forEach(b => b.onclick = closeSheet);
    after?.();
  }
  function closeSheet() {
    $("sheet").hidden = true; $("scrim").hidden = true; document.body.style.overflow = "";
    onSheetClose?.(); onSheetClose = null;
  }
  $("scrim").onclick = closeSheet;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
  const head = (title) => `<div class="sheethead"><h3>${title}</h3><button class="close" type="button" data-close aria-label="Close">×</button></div>`;
  const segHTML = (sel) => `<div class="seg" role="group" aria-label="Meal">${MEALS.map(([k, l]) => `<button type="button" data-meal="${k}" aria-pressed="${k === sel}">${l}</button>`).join("")}</div>`;
  const wireSeg = (root, cb) => root.querySelectorAll("[data-meal]").forEach(b => b.onclick = () => {
    root.querySelectorAll("[data-meal]").forEach(x => x.setAttribute("aria-pressed", x === b)); cb(b.dataset.meal);
  });

  function recentFoods() {
    const seen = new Map();
    for (const k of [...state.days.keys()].sort().reverse()) {
      for (const e of [...state.days.get(k)].reverse()) { const id = e.name.toLowerCase(); if (!seen.has(id)) seen.set(id, e); }
      if (seen.size >= 8) break;
    }
    return [...seen.values()].slice(0, 8);
  }

  function openManual(meal) {
    let sel = meal || mealByClock();
    const recent = recentFoods();
    openSheet(`${head("Add food")}
      ${segHTML(sel)}
      ${recent.length ? `<div class="field"><span class="lab">Recent · tap to add</span><div class="chips">${recent.map((e, i) => `<button class="chip" type="button" data-r="${i}">${esc(e.name)}<b>${fmt(e.kcal)}</b></button>`).join("")}</div></div>` : ""}
      <form id="addForm" autocomplete="off" style="display:grid;gap:14px">
        <div class="field"><label for="fName">Food</label><input id="fName" list="foodList" placeholder="Search, e.g. banana" required></div>
        <div class="grid2">
          <div class="field"><label for="fKcal">Calories per serving</label><input id="fKcal" type="number" min="0" step="1" inputmode="numeric" required></div>
          <div class="field"><label for="fQty">Servings</label><input id="fQty" type="number" min="0.1" step="0.1" value="1" inputmode="decimal"></div>
        </div>
        <div class="grid3">
          <div class="field"><label for="fP">Protein g</label><input id="fP" type="number" min="0" step="0.1" inputmode="decimal"></div>
          <div class="field"><label for="fC">Carbs g</label><input id="fC" type="number" min="0" step="0.1" inputmode="decimal"></div>
          <div class="field"><label for="fF">Fat g</label><input id="fF" type="number" min="0" step="0.1" inputmode="decimal"></div>
        </div>
        <p class="hint" id="servingHint">Pick a suggestion to fill in the numbers, or copy them from the label.</p>
        <p class="err" id="formErr" role="alert"></p>
        <button class="primary" type="submit">Add</button>
      </form>`, () => {
      const p = $("sheetPanel");
      wireSeg(p, (m) => sel = m);
      p.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
        const e = recent[+b.dataset.r];
        addEntries([{ name: e.name, kcal: e.kcal, p: e.p || 0, c: e.c || 0, f: e.f || 0, qty: 1, meal: sel }], `Added ${e.name}`);
        closeSheet();
      });
      $("fName").addEventListener("input", () => {
        const f = FOODS.find(x => x[0].toLowerCase() === $("fName").value.trim().toLowerCase());
        if (!f) return;
        $("fKcal").value = f[2]; $("fP").value = f[3]; $("fC").value = f[4]; $("fF").value = f[5];
        $("servingHint").textContent = `1 serving = ${f[1]}. Typical values; your label may differ.`;
      });
      $("addForm").addEventListener("submit", (ev) => {
        ev.preventDefault();
        const name = $("fName").value.trim(), kcal = parseFloat($("fKcal").value);
        if (!name) return $("formErr").textContent = "Enter a food name.";
        if (!(kcal >= 0)) return $("formErr").textContent = "Enter the calories per serving.";
        const num = (id) => Math.max(0, parseFloat($(id).value) || 0);
        addEntries([{ name, kcal, p: num("fP"), c: num("fC"), f: num("fF"), qty: parseFloat($("fQty").value) || 1, meal: sel }], `Added ${name}`);
        closeSheet();
      });
    });
  }

  function openGoals() {
    const g = state.goals;
    openSheet(`${head("Daily goals")}
      <form id="goalForm" style="display:grid;gap:14px">
        <div class="field"><label for="gKcal">Calories (kcal)</label><input id="gKcal" type="number" min="800" max="8000" step="10" value="${g.kcal}" inputmode="numeric"></div>
        <div class="grid3">
          <div class="field"><label for="gP">Protein g</label><input id="gP" type="number" min="0" step="1" value="${g.p}" inputmode="numeric"></div>
          <div class="field"><label for="gC">Carbs g</label><input id="gC" type="number" min="0" step="1" value="${g.c}" inputmode="numeric"></div>
          <div class="field"><label for="gF">Fat g</label><input id="gF" type="number" min="0" step="1" value="${g.f}" inputmode="numeric"></div>
        </div>
        <p class="hint" id="goalCheck"></p>
        <button class="primary" type="submit">Save goals</button>
      </form>`, () => {
      const check = () => { $("goalCheck").textContent = `Your macros add up to ${fmt((+$("gP").value || 0) * 4 + (+$("gC").value || 0) * 4 + (+$("gF").value || 0) * 9)} kcal (4 per gram of protein or carbs, 9 per gram of fat).`; };
      ["gP", "gC", "gF"].forEach(id => $(id).addEventListener("input", check)); check();
      $("goalForm").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const kcal = Math.round(+$("gKcal").value);
        if (!(kcal >= 800 && kcal <= 8000)) { $("goalCheck").textContent = "Set a calorie goal between 800 and 8,000."; return; }
        state.goals = { kcal, p: Math.max(0, +$("gP").value || 0), c: Math.max(0, +$("gC").value || 0), f: Math.max(0, +$("gF").value || 0) };
        closeSheet(); render();
        try { await backend?.saveGoals(state.goals); toast("Goals saved"); } catch (e) { toast("Couldn't save goals."); }
      });
    });
  }
  $("goalsBtn").onclick = openGoals;

  // ---------- Photo logging ----------
  let sample = null, canSnap = false, snapCtrl = null, snap = null, shotUrl = null;
  (async () => {
    try { sample = await window.claude?.use?.("sample"); } catch (e) {}
    if (sample) canSnap = !!(await sample.limits().catch(() => null))?.images;
  })();

  $("snapBtn").onclick = () => {
    if (canSnap) { $("photo").value = ""; $("photo").click(); return; }
    openSheet(`${head("Photo logging unavailable")}
      <p style="margin:0">Photo logging needs Claude, which isn't available here. Open this page in the Claude app or at claude.ai while signed in.</p>
      <button class="primary" type="button" id="goManual">Add food by hand</button>`, () => { $("goManual").onclick = () => openManual(); });
  };
  $("photo").addEventListener("change", (e) => { const f = e.target.files?.[0]; if (f) analyse(f, ""); });

  async function shrink(file) {
    try {
      const bmp = await createImageBitmap(file);
      const s = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
      cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
      return await new Promise(r => cv.toBlob(b => r(b || file), "image/jpeg", 0.85));
    } catch (e) { return file; }
  }
  const SNAP_ERR = {
    not_granted: "Photo logging is turned off for this page. You can allow it from the page's Permissions menu.",
    rate_limited: "You've reached your Claude usage limit for now. Try again later, or add the food by hand.",
    image_rejected: "That image couldn't be read. Try a JPEG or PNG photo.",
    refused: "Claude couldn't analyse this photo. Try another shot.",
    invalid_json: "The estimate came back garbled. Try again.",
  };

  async function analyse(file, hint) {
    const blob = await shrink(file);
    if (shotUrl) URL.revokeObjectURL(shotUrl);
    shotUrl = URL.createObjectURL(blob);
    onSheetClose = () => { snapCtrl?.abort(); snapCtrl = null; };
    openSheet(`${head("Reading your plate")}<img class="shot" src="${shotUrl}" alt="Your meal"><div class="thinking"><span class="spinner"></span>Identifying foods and portions…</div>`);
    snapCtrl = new AbortController();
    const prompt = `You are a nutrition analyst. The attached image is a photo of food someone is about to eat or just ate.
Identify every distinct food and drink item visible. For each, estimate the portion actually shown using visual cues (plate size ~26 cm, utensils, hands, packaging) and give calories and macros for THAT portion, using standard nutrition references (e.g. USDA). Include visible oils, sauces, dressings and toppings, either as their own item or folded into the dish, and say which in the portion text.
${hint ? `The person added this note: "${hint.slice(0, 300)}". Trust it over what you see.` : ""}
If the image contains no food, return an empty items array and explain in "note".
Respond with JSON only, in exactly this shape:
{"items":[{"name":"short food name","portion":"e.g. about 1 cup (150 g)","kcal":0,"protein_g":0,"carbs_g":0,"fat_g":0}],"confidence":"low|medium|high","note":"one short sentence on what most affects accuracy"}`;
    try {
      const out = await sample.json(prompt, { images: [blob], modelTier: "default", signal: snapCtrl.signal, cache: false });
      snapCtrl = null; onSheetClose = null;
      snap = {
        file, meal: state.date === todayKey() ? mealByClock() : "lunch",
        confidence: ["low", "medium", "high"].includes(out?.confidence) ? out.confidence : "medium",
        note: String(out?.note || "").slice(0, 240),
        items: (Array.isArray(out?.items) ? out.items : []).map(i => ({
          name: String(i.name || "Food").slice(0, 80), portion: String(i.portion || "").slice(0, 80),
          kcal: Math.max(0, +i.kcal || 0), p: Math.max(0, +i.protein_g || 0), c: Math.max(0, +i.carbs_g || 0), f: Math.max(0, +i.fat_g || 0), on: true, qty: 1,
        })),
      };
      renderReview();
    } catch (e) {
      snapCtrl = null; onSheetClose = null;
      if (e?.code === "cancelled") return;
      openSheet(`${head("Couldn't read that")}<img class="shot" src="${shotUrl}" alt="Your meal"><p class="err">${SNAP_ERR[e?.code] || "Something went wrong. Try again, or add the food by hand."}</p>
        <div class="grid2"><button class="secondary" type="button" id="goManual">Add by hand</button><button class="primary" type="button" id="retry">Try again</button></div>`, () => {
        $("retry").onclick = () => analyse(file, hint);
        $("goManual").onclick = () => openManual();
      });
    }
  }

  function renderReview() {
    const r = snap;
    if (!r.items.length) {
      openSheet(`${head("No food found")}<img class="shot" src="${shotUrl}" alt="Your meal"><p style="margin:0">${esc(r.note || "Try a closer photo of the plate.")}</p><button class="primary" type="button" id="again">Take another photo</button>`,
        () => { $("again").onclick = () => { closeSheet(); $("photo").value = ""; $("photo").click(); }; });
      return;
    }
    const tot = r.items.filter(i => i.on).reduce((s, i) => s + i.kcal * i.qty, 0);
    const scroll = $("sheetPanel").scrollTop;
    openSheet(`${head("Here's what I see")}
      <img class="shot" src="${shotUrl}" alt="Your meal">
      <div>${r.items.map((it, i) => `
        <div class="ritem">
          <input type="checkbox" id="ri${i}" ${it.on ? "checked" : ""}>
          <label class="name" for="ri${i}">${esc(it.name)}<div class="meta">${esc(it.portion)}</div></label>
          <div class="right"><b>${fmt(it.kcal * it.qty)}</b>
            <select id="rq${i}" aria-label="Portion of ${esc(it.name)}">${PORTIONS.map(p => `<option value="${p}" ${p === it.qty ? "selected" : ""}>${p}×</option>`).join("")}</select></div>
        </div>`).join("")}</div>
      <div class="totalrow"><span class="t">${fmt(tot)} kcal</span><span class="conf ${r.confidence}">${r.confidence} confidence</span></div>
      ${r.note ? `<p class="hint">${esc(r.note)}</p>` : ""}
      ${segHTML(r.meal)}
      <button class="primary" type="button" id="snapAdd" ${r.items.some(i => i.on) ? "" : "disabled"}>Add to ${MEALS.find(m => m[0] === r.meal)[1]}</button>
      <div class="field"><label for="snapHint">Not quite right? Tell Claude</label>
        <div class="inline"><input id="snapHint" placeholder="e.g. double portion, fried in butter"><button class="secondary" type="button" id="recheck">Re-check</button></div></div>`, () => {
      const p = $("sheetPanel");
      p.scrollTop = scroll;
      r.items.forEach((it, i) => {
        $("ri" + i).onchange = (e) => { it.on = e.target.checked; renderReview(); };
        $("rq" + i).onchange = (e) => { it.qty = +e.target.value; renderReview(); };
      });
      wireSeg(p, (m) => { r.meal = m; $("snapAdd").textContent = "Add to " + MEALS.find(x => x[0] === m)[1]; });
      $("recheck").onclick = () => { const h = $("snapHint").value.trim(); if (h) analyse(r.file, h); };
      $("snapAdd").onclick = () => {
        const picked = r.items.filter(i => i.on);
        addEntries(picked.map(i => ({ name: i.name, kcal: Math.round(i.kcal), p: i.p, c: i.c, f: i.f, qty: i.qty, meal: r.meal, src: "photo" })),
          `Added ${fmt(picked.reduce((s, i) => s + i.kcal * i.qty, 0))} kcal`);
        closeSheet();
      };
    });
  }

  render();
  connect();
})();
</script>
